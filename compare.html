<!doctype html>
<html lang="en" data-theme="battery">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compare · Student Laptop Finder</title>
  <link rel="stylesheet" href="dist/output.css">
</head>
<body class="flex min-h-screen flex-col bg-page text-ink antialiased">
  <div id="site-header"></div>
  <main class="mx-auto w-full max-w-6xl flex-1 px-4 py-6 sm:py-8">
    <h1 class="text-2xl font-extrabold sm:text-3xl">Compare laptops</h1>
    <p class="mt-1 text-muted">Pick 2 to 4 of your favorites. The best value in each row is highlighted.</p>
    <p id="compare-msg" role="alert" class="mt-3 font-semibold text-accent"></p>
    <div id="picker" class="mt-3 grid gap-2 sm:grid-cols-2 lg:grid-cols-4"></div>
    <div id="compare-table" class="mt-6"></div>
  </main>
  <div id="site-footer"></div>
  <script type="module" src="src/js/comparePage.js"></script>
</body>
</html>
